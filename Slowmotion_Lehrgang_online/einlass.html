<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest-einlass.webmanifest">
<meta name="apple-mobile-web-app-title" content="Einlass">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slowmotion Einlass</title>
<link rel="stylesheet" href="style.css">
<style>
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .top-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .ev-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 18px; line-height: 1.1; }
  .ev-sub { font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .pill.off i { background: var(--warn); }
  .pill.err i { background: #ff5d6c; }
  .counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .count { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .count b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .count span { font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--red-2); border-color: transparent; color: #fff; }
  main { padding-block: 14px 60px; display: grid; gap: 14px; }
  .tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .tools2 { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--gold); color: #1c1307; border-color: transparent; }
  .list { display: grid; gap: 8px; }
  .person { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 14px; }
  .person.is-present { border-color: #2c6b4b; background: #14211b; }
  .person .who { min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .person .nm { font-weight: 800; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
  .person .sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .tag { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .tag.nofoto { background: #3a1419; border-color: #6b2330; color: #ffb3bd; }
  .tog.bz.on { background: #1f6b45; border-color: #2f9a63; color: #fff; }
  .tog.bz.open { border-color: #6b2330; color: #ff9aa7; }
  .tog.bz.due { background: #7a1626; border-color: #c4213a; color: #fff; }
  .count { text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .count.warn { border-color: #c4213a; }
  .count.warn b { color: #ff8f9c; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .bar .sel { display: grid; gap: 2px; flex: 1 1 150px; font-size: 12px; color: var(--muted); }
  .bar .sel select { width: 100%; padding: 9px 34px 9px 12px; font-size: 15px; }
  details.card > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: '▾'; color: var(--gold); transition: transform .15s; }
  details.card[open] > summary::after { transform: rotate(180deg); }
  details.card > summary h2 { margin: 0; }
  details.card > summary .sum { margin-left: auto; color: var(--muted); font-size: 14px; font-weight: 700; }
  .tog.bz.red { background: #4a2f12; border-color: #c98a2e; color: #ffd08a; }
  .tog.bz.free { background: #1d2a3a; border-color: #4b77b5; color: #a9c8ff; }
  details.prices { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  details.prices summary { cursor: pointer; font-weight: 700; }
  details.prices[open] { display: grid; gap: 10px; }
  body.kiosk-on { overflow: hidden; }
  .kiosk { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .kwrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
  .khead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .khead select { width: auto; padding: 8px 34px 8px 12px; font-size: 14px; }
  .kdone { text-align: center; padding-top: 12vh; }
  .kcheck { font-size: 64px; color: var(--ok); line-height: 1; }
  .kpw { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 16px; }
  .kpw .kwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; }
  .paygrp { display: flex; gap: 4px; }
  .tog.more { min-width: 40px; width: 40px; font-size: 20px; }
  .tog.more.bigtog { width: 56px; min-width: 56px; }
  .pm { display: grid; gap: 8px; }
  .stale { background: #3a2a10; border: 1px solid #a8741f; color: #ffd08a; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .pill small { opacity: .7; font-weight: 600; }
  .cashres { font-size: 16px; }
  .cashres .ok { color: var(--ok); } .cashres .bad { color: #ff8f9c; }
  .tag.dup { background: #3a2f12; border-color: #8a6a1f; color: #f3d68c; }
  .tag.pre { background: #14211b; border-color: #2c6b4b; color: #7fe0ae; }
  .sortby { display: flex; align-items: center; gap: 8px; }
  .sortby select { width: auto; padding: 8px 34px 8px 12px; font-size: 14px; }
  .tog { min-width: 78px; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); font-weight: 800; font-size: 14px; cursor: pointer; display: grid; place-items: center; line-height: 1.1; }
  .tog.on.da { background: var(--ok); border-color: var(--ok); color: #06210f; }
  .tog.on.bz { background: #1f6b45; border-color: #2f9a63; color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dlg { padding: 18px; display: grid; gap: 14px; }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .welcome { text-align: center; display: grid; gap: 10px; }
  .welcome .big { font-size: 28px; font-weight: 900; line-height: 1.15; }
  .welcome .ok { font-size: 46px; line-height: 1; color: var(--ok); }
  .bigtog { height: 64px; font-size: 20px; border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .poster { background: #fff; color: #111; border-radius: 16px; padding: 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
  .poster .p-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 34px; line-height: 1; }
  .poster .p-qr { width: min(70vw, 320px); }
  .poster .p-qr svg { width: 100%; height: auto; display: block; }
  .poster .p-url { font: 600 14px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 3/4; object-fit: cover; }
  .print-only { display: none; }
  #printArea { display: none; }
  /* Feste Spalten: „Da“ steht in jeder Zeile an derselben Stelle */
  .person { grid-template-columns: minmax(0, 1fr) 96px 220px; }
  .person .tog.da { width: 96px; }
  .person .paygrp { width: 220px; }
  .person .paygrp .tog.bz { flex: 1; min-width: 0; padding: 0 6px; }
  .colhead { display: grid; grid-template-columns: minmax(0, 1fr) 96px 220px; gap: 8px; padding: 0 10px 0 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .fbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: #2a2210; border: 1px solid #8a6a1f; color: #f3d68c; border-radius: 10px; padding: 7px 10px 7px 12px; font-size: 14px; }
  .fbar b { color: #fff; }
  .toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; width: min(560px, calc(100vw - 24px)); background: #1f2a24; border: 1px solid #2f9a63; color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 15px; }
  .btn.del { background: #7a1626; color: #fff; border: 1px solid #c4213a; margin-top: 10px; }
  .pm hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0 0; width: 100%; }
  .hold { position: relative; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .hold::before { content: ''; position: absolute; inset: 0; width: 0; background: rgba(201,162,74,.45); transition: width 0s; }
  .hold.holding::before { width: 100%; transition: width 3s linear; }
  .hold span { position: relative; }
  main > * { min-width: 0; }
  #alf .field, #alf input { min-width: 0; max-width: 100%; }
  /* Handy: Name oben in voller Breite, Knöpfe darunter in einer Reihe */
  @media (max-width: 600px) {
    .person { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px 8px; padding: 12px; }
    .person .who { grid-column: 1 / -1; }
    .person .tog.da { width: 100%; min-width: 0; }
    .person .paygrp { min-width: 0; width: auto; }
    .colhead { display: none; }
    .person .paygrp .tog.bz { flex: 1; min-width: 0; padding: 0 6px; }
    .person .tog.more { width: 52px; min-width: 52px; }
    .tabs button { padding: 9px 12px; }
  }
  @media print {
    html { background: #fff !important; }
    .printing.cards { display: grid !important; grid-template-columns: repeat(2, 88mm); grid-auto-rows: 54mm; justify-content: center; }
    .cardp { border: 0.3mm dashed #888; padding: 4mm; display: grid; grid-template-columns: 30mm 1fr; gap: 4mm; align-items: center; color: #000; background: #fff; font-family: system-ui, -apple-system, Arial, sans-serif; }
    .cardp svg { width: 30mm; height: 30mm; display: block; }
    .cardp .t1 { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 15pt; line-height: 1; }
    .cardp .t2 { font-size: 7.5pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 1mm 0 2mm; }
    .cardp .t3 { font-size: 8.5pt; line-height: 1.25; }
    .cardp .t4 { font-size: 7.5pt; margin-top: 2mm; color: #333; }
    @page { size: A4; margin: 10mm; }
    body { background: #fff; color: #000; padding: 0; }
    .top, main > *:not(.printing), footer, .demo { display: none !important; }
    main { padding: 0; }
    .printing { display: block !important; }
    .print-only { display: block; }
    .poster { border-radius: 0; padding: 30mm 15mm; }
    .poster .p-qr { width: 110mm; }
    .plist { color: #000; }
    .plist th, .plist td { border-bottom: 1px solid #999; color: #000; padding: 5px 6px; font-size: 12px; }
    .plist .box { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #000; }
    body.printlist .wrap, body.printlist dialog, body.printlist .toast { display: none !important; }
    body.printlist #printArea { display: block !important; }
  }
</style>
</head>
<body>
<div class="wrap wide">
  <div id="app"></div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="printArea" class="plist"></div>

<script src="config.js"></script>
<script src="lang.js"></script>
<script src="lib/qrcode.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const L = window.LG, api = L.api, esc = L.esc;
  const $ = id => document.getElementById(id);
  const app = $('app'), dlg = $('dlg'), dlgBody = $('dlgBody');
  L.registerSW();

  let key = L.store('lg_key');
  let eventId = L.store('lg_event') || null;
  let data = L.storeJson('lg_cache');          // {events, event_id, people, server_time}
  let queue = L.storeJson('lg_queue') || [];   // ausstehende Änderungen
  let tab = 'einlass', filter = 'todo', search = '', sortBy = 'name';
  let syncState = 'idle', lastSync = L.store('lg_last_sync'), flushing = false, timer = null;
  let pendingTicket = (location.hash || '').replace('#', '').toUpperCase() || null;

  function saveLocal() { L.storeJson('lg_cache', data); L.storeJson('lg_queue', queue); }
  function people() { return (data && data.people) || []; }
  function event() { return data && data.events ? (data.events.find(e => e.id === data.event_id) || null) : null; }

  /* ---------- Dialog ---------- */
  function openDialog(html) { dlgBody.innerHTML = html; if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', ''); }
  function closeDialog() { stopScan(); if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  dlg.addEventListener('close', stopScan);
  let shownIds = new Set(), toastTimer = null;
  function toast(html, btnLabel, onBtn) {
    let t = $('toast'); if (t) t.remove(); clearTimeout(toastTimer);
    t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span>${html}</span>${btnLabel ? `<button class="btn small gold" type="button" id="toastBtn">${esc(btnLabel)}</button>` : ''}`;
    document.body.appendChild(t);
    if (btnLabel) $('toastBtn').onclick = () => { t.remove(); onBtn(); };
    toastTimer = setTimeout(() => t.remove(), 7000);
  }
  const FILTERS = [['todo', 'Noch zu erledigen'], ['offen', 'Noch nicht da'], ['vorab', 'Vorangemeldet, noch nicht da'], ['zahlen', 'Da, Bezahlung offen'], ['da', 'Da'], ['doppelt', 'Mögliche Doppeleinträge'], ['alle', 'Alle']];
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });

  /* ---------- Anmeldung am Gerät ---------- */
  function showLogin(msg) {
    app.innerHTML = `<div class="hero"><div class="shield" style="width:110px;height:92px">${L.SHIELD}</div><h1 class="title" style="font-size:40px">Einlass</h1></div>
      <form class="card" id="lf" style="max-width:420px;margin:0 auto">
        <h2>Gerät anmelden</h2>
        <p class="muted small" style="margin:0">Einmal mit Internet anmelden. Das Gerät bleibt angemeldet und funktioniert danach auch ohne Netz.</p>
        ${L.online ? '' : '<div class="demo" style="margin:0">Vorschau-Modus: Passwort <b>demo</b></div>'}
        <div class="field"><label for="pw">Einlass-Passwort</label><input type="password" id="pw" autocomplete="current-password"></div>
        ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
        <button class="btn block" type="submit" id="lb">Anmelden</button>
      </form>`;
    $('lf').onsubmit = async ev => {
      ev.preventDefault(); $('lb').disabled = true;
      try {
        const d = await api.adminData($('pw').value, null);
        key = $('pw').value; L.store('lg_key', key);
        data = d; eventId = d.event_id; L.store('lg_event', eventId); queue = []; saveLocal(); markSynced();
        start();
      } catch (e) {
        showLogin(e.code === 'bad_key' ? 'Das Passwort stimmt nicht.' : 'Keine Verbindung. Für die erste Anmeldung braucht das Gerät Internet.');
      }
    };
  }

  /* ---------- Abgleich ---------- */
  function markSynced() { lastSync = new Date().toISOString(); L.store('lg_last_sync', lastSync); syncState = 'ok'; }
  async function sync() {
    if (flushing || !key) return; flushing = true;
    try {
      let d;
      if (queue.length) {
        const ops = queue.slice();
        d = await api.adminSync(key, eventId, ops);
        queue = queue.slice(ops.length);
        if (queue.length) d.people = L.applyOps(d.people, queue, d.event_id);
      } else {
        d = await api.adminData(key, eventId);
        // Während der Abfrage neu abgehakte Personen nicht überschreiben
        if (queue.length) d.people = L.applyOps(d.people, queue, d.event_id);
      }
      data = d; eventId = d.event_id; L.store('lg_event', eventId); saveLocal(); markSynced();
    } catch (e) {
      if (e.code === 'bad_key') { L.store('lg_key', null); key = null; flushing = false; return showLogin('Das Passwort wurde geändert. Bitte neu anmelden.'); }
      syncState = e.code === 'network' ? 'offline' : 'error';
    } finally { flushing = false; }
    renderTop();
    // Nicht neu zeichnen, während jemand in ein Feld tippt (sonst springt der Cursor raus)
    if (!typingInMain()) renderMain(true);
  }
  function typingInMain() {
    const a = document.activeElement, m = $('main');
    return !!(a && m && m.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q');
  }
  function act(op) {
    if (op.op === 'set' || op.op === 'add') op.at = op.at || new Date().toISOString();
    const wasShown = op.op === 'set' && tab === 'einlass' && shownIds.has(op.id);
    queue.push(op); data.people = L.applyOps(people(), [op], data.event_id);
    if (op.op === 'add') L.sortPeople(data.people);
    saveLocal(); renderTop(); renderMain(true);
    if (wasShown && !shownIds.has(op.id)) {
      const x = people().find(y => y.id === op.id);
      if (x) toast(`Gespeichert. <b>${esc(x.first_name)} ${esc(x.last_name)}</b> ist wegen des Filters ausgeblendet.`, 'Alle anzeigen', () => { filter = 'alle'; renderMain(); });
    }
    clearTimeout(timer); timer = setTimeout(sync, 400);
  }
  window.addEventListener('online', () => sync());
  // Mehrere Geräte gleichzeitig: alle 10 Sekunden abgleichen, sofort beim Zurückkehren in die Seite
  setInterval(() => { if (!document.hidden) sync(); }, 10000);
  setInterval(() => { if (!document.hidden && !$('kioskBox')) renderTop(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  /* ---------- Gerüst ---------- */
  function start() {
    app.innerHTML = `<div class="top" id="top"></div>${L.online ? '' : '<div class="demo">Vorschau-Modus: Daten nur in diesem Browser. <button class="btn small ghost" id="seed" type="button">10 Beispiel-Anmeldungen</button> <button class="btn small ghost" id="reset" type="button">Vorschau zurücksetzen</button></div>'}<main id="main"></main>`;
    if (!L.online) {
      $('seed').onclick = () => { L.demo.seed(10); sync(); };
      $('reset').onclick = () => { L.demo.reset(); location.reload(); };
    }
    renderTop(); renderMain();
    sync().then(() => { if (pendingTicket) handleTicket(pendingTicket); });
    if (pendingTicket && data) handleTicket(pendingTicket);
  }

  function counts() {
    const p = people();
    // Zahlstatus: bezahlt (zählt für die Kasse) · frei (z. B. Ehrenmitglied, zählt NICHT für die Kasse) · offen
    return { all: p.length, da: p.filter(x => x.present).length, paid: p.filter(x => x.paid && !x.free).length, free: p.filter(x => x.free).length, open: p.filter(x => x.present && !x.paid && !x.free).length };
  }

  document.addEventListener('click', e => { const b = e.target.closest('[data-cf]'); if (!b) return; filter = b.dataset.cf; tab = 'einlass'; renderTop(); renderMain(); });
  function renderTop() {
    const top = $('top'); if (!top) return;
    const e = event(), c = counts();
    let pill;
    if (queue.length && syncState !== 'ok') pill = `<span class="pill off"><i></i>Ohne Netz · ${queue.length} ${queue.length === 1 ? 'Änderung wartet' : 'Änderungen warten'}</span>`;
    else if (queue.length) pill = `<span class="pill off"><i></i>Speichert …</span>`;
    else if (syncState === 'offline') pill = `<span class="pill off"><i></i>Ohne Netz · alles gespeichert</span>`;
    else if (syncState === 'error') pill = `<span class="pill err"><i></i>Fehler beim Abgleich</span>`;
    else pill = `<span class="pill"><i></i>Online · alles gespeichert</span>`;
    const age = lastSync ? (Date.now() - new Date(lastSync).getTime()) / 1000 : Infinity;
    const stamp = lastSync ? new Date(lastSync).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '–';
    const stale = age > 60 ? `<div class="stale">⚠ Dieses Gerät zeigt evtl. einen älteren Stand (letzter Abgleich ${stamp} Uhr${queue.length ? `, ${queue.length} Änderung${queue.length === 1 ? '' : 'en'} warten` : ''}). Internet prüfen, notfalls Hotspot. Nichts geht verloren.</div>` : '';
    pill = pill.replace('</span>', ` <small>· ${stamp}</small></span>`);
    top.innerHTML = `<div class="top-row"><div><div class="ev-title">${esc(e ? e.title : 'Lehrgang')}</div><div class="ev-sub">${e ? esc([L.fmtDate(e.event_date), e.time_text].filter(Boolean).join(' · ')) : ''}</div></div>${pill}</div>
      ${stale}
      <div class="counts"><button class="count" type="button" data-cf="da"><b>${c.da}</b><span>von ${c.all} da</span></button><button class="count" type="button" data-cf="alle"><b>${c.paid}</b><span>bezahlt${c.free ? ` · ${c.free} frei` : ''}</span></button><button class="count ${c.open ? 'warn' : ''}" type="button" data-cf="zahlen"><b>${c.open}</b><span>da, Bezahlung offen</span></button></div>
      <div class="tabs" role="tablist">${[['einlass', 'Einlass'], ['uebersicht', 'Übersicht'], ['plakat', 'Plakat'], ['album', 'Album'], ['lehrgaenge', 'Lehrgänge']].map(([k, v]) => `<button role="tab" aria-selected="${tab === k}" data-tab="${k}">${v}</button>`).join('')}</div>`;
    top.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderTop(); renderMain(); });
  }

  function renderMain(soft) {
    const m = $('main'); if (!m) return;
    if (tab === 'einlass') return soft && $('list') ? renderList() : renderEinlass(m);
    if (soft && tab !== 'uebersicht') return;
    if (tab === 'uebersicht') return renderOverview(m);
    if (tab === 'plakat') return renderPoster(m);
    if (tab === 'lehrgaenge') return renderEvents(m);
    if (tab === 'album') return renderAlbum(m);
  }

  /* ---------- Einlass ---------- */
  const canScan = 'BarcodeDetector' in window;
  function renderEinlass(m) {
    m.innerHTML = `<div class="tools"><input type="search" id="q" placeholder="Name oder Code suchen" value="${esc(search)}" autocomplete="off" aria-label="Name oder Code suchen"><button class="btn gold" id="add" type="button">+ Gast</button></div>
      <button class="btn ghost small" id="kiosk" type="button" title="Gerät der Person geben: Sie trägt sich selbst ein, ohne die Liste zu sehen">✍︎ Gast tippt selbst</button>
      <div class="bar">${canScan ? '<button class="btn ghost small" id="scan" type="button">QR scannen</button>' : ''}
        <label class="sel"><span>Filter</span><select id="flt">${FILTERS.map(([k, v]) => `<option value="${k}" ${filter === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="sel"><span>Sortieren</span><select id="sort">${[['name', 'Name'], ['schule', 'Schule'], ['stufe', 'Stufe'], ['vorab', 'Vorangemeldet zuerst'], ['ankunft', 'Ankunft']].map(([k, v]) => `<option value="${k}" ${sortBy === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
      <div id="fbar"></div>
      <p class="muted small" id="fhint" style="margin:0"></p>
      <div class="colhead"><span>Name</span><span>Anwesenheit</span><span>Zahlung</span></div>
      <div class="list" id="list"></div>
      ${canScan ? '' : '<p class="muted small" style="margin:0">QR-Codes scannst du mit der normalen Kamera-App: Dann öffnet sich diese Seite und hakt die Person automatisch ab.</p>'}
      <details class="prices"${prices().regular == null ? '' : ''}><summary>Einstellung: Preise – ${prices().regular != null ? eur(prices().regular) : 'noch nicht festgelegt'}${prices().reduced != null ? ' · ermäßigt ' + eur(prices().reduced) : ''}</summary>
        <div class="row2"><div class="field"><label for="preg">Regulär (€)</label><input type="text" inputmode="decimal" id="preg" value="${prices().regular ?? ''}" placeholder="z. B. 50"></div>
        <div class="field"><label for="pred">Ermäßigt (€), z. B. Familie</label><input type="text" inputmode="decimal" id="pred" value="${prices().reduced ?? ''}" placeholder="z. B. 30"></div></div>
        <div class="row"><button class="btn small" id="psave" type="button">Preise speichern</button><span class="muted small" id="pmsg">Nur hier für Veranstalter sichtbar, nicht auf der Anmeldeseite.</span></div></details>`;
    $('q').oninput = e => { search = e.target.value; renderList(); };
    $('sort').onchange = e => { sortBy = e.target.value; renderList(); };
    $('flt').onchange = e => { filter = e.target.value; renderList(); };
    $('psave').onclick = async () => {
      const num = v => { v = String(v).trim().replace(',', '.'); return v === '' ? null : (isFinite(+v) && +v >= 0 ? +v : NaN); };
      const r = num($('preg').value), red = num($('pred').value);
      if (Number.isNaN(r) || Number.isNaN(red)) { $('pmsg').textContent = 'Bitte nur Zahlen eintragen, z. B. 50 oder 30,50.'; return; }
      $('psave').disabled = true; $('pmsg').textContent = 'Wird gespeichert …';
      try { if (queue.length) await sync(); data = await api.adminSetPrices(key, eventId || data.event_id, r, red); saveLocal(); markSynced(); renderEinlass($('main')); }
      catch (e) { $('pmsg').textContent = 'Speichern ging nicht (Internet?). Bitte später noch einmal.'; $('psave').disabled = false; }
    };
    $('add').onclick = () => addDialog();
    $('kiosk').onclick = () => kiosk();
    if (canScan) $('scan').onclick = scanDialog;
    // (Filter jetzt als Auswahlfeld)
    renderList();
  }
  // Zahlstatus reihum: offen → bezahlt (regulär) → ermäßigt → frei → offen. Betrag wird beim Antippen festgehalten.
  function prices() { return (data && data.prices) || {}; }
  function eur(v) { return v == null || v === '' ? '' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: Number(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €'; }
  function payState(x) { return x.free ? 'frei' : x.paid ? (x.reduced ? 'erm' : 'bez') : 'offen'; }
  function nextPay(x) {
    const pr = prices(), st = payState(x);
    if (st === 'offen') return { paid: true, reduced: false, free: false, amount: pr.regular ?? null };
    if (st === 'bez') return { paid: true, reduced: true, free: false, amount: pr.reduced ?? null };
    if (st === 'erm') return { paid: false, reduced: false, free: true, amount: 0 };
    return { paid: false, reduced: false, free: false, amount: null };
  }
  function payLabel(x) {
    const st = payState(x), a = x.amount;
    return st === 'bez' ? '✓ Bezahlt' + (a ? ' ' + eur(a) : '') : st === 'erm' ? '✓ Ermäßigt' + (a ? ' ' + eur(a) : '') : st === 'frei' ? '★ Frei' : '€ offen';
  }
  function payMenu(id, anchorDone) {
    const x = people().find(y => y.id === id); if (!x) return;
    const pr = prices(), st = payState(x);
    const opt = (k, label) => `<button class="btn block ${st === k ? 'gold' : 'ghost'}" type="button" data-pm="${k}">${label}</button>`;
    openDialog(`<h2>Bezahlung: ${esc(x.first_name)} ${esc(x.last_name)}</h2>
      <div class="pm">${opt('bez', '✓ Bezahlt' + (pr.regular != null ? ' – ' + eur(pr.regular) : ''))}${opt('erm', '✓ Ermäßigt' + (pr.reduced != null ? ' – ' + eur(pr.reduced) : ''))}${opt('frei', '★ Frei (Ehrenmitglied, eingeladener Gast)')}${opt('offen', 'Zurücksetzen: noch offen')}
      ${anchorDone ? '' : '<hr><button class="btn block del" id="pmdel" type="button">Person löschen</button>'}</div>
      <div class="row"><button class="btn ghost" id="pmc" type="button">Abbrechen</button></div>`);
    if ($('pmdel')) $('pmdel').onclick = () => deleteAsk(id);
    const val = { bez: { paid: true, reduced: false, free: false, amount: pr.regular ?? null }, erm: { paid: true, reduced: true, free: false, amount: pr.reduced ?? null }, frei: { paid: false, reduced: false, free: true, amount: 0 }, offen: { paid: false, reduced: false, free: false, amount: null } };
    dlgBody.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { act(Object.assign({ op: 'set', id }, val[b.dataset.pm])); closeDialog(); if (anchorDone) anchorDone(); });
    $('pmc').onclick = closeDialog;
  }
  function deleteAsk(id) {
    const x = people().find(y => y.id === id); if (!x) return;
    openDialog(`<h2>Person löschen?</h2>
      <p style="margin:0;font-size:18px"><b>${esc(x.first_name)} ${esc(x.last_name)}</b></p>
      <p class="muted" style="margin:0">Der ganze Eintrag wird von der Liste entfernt: ${x.source === 'vorab' ? 'Voranmeldung, ' : ''}Anwesenheit und Zahlung${payState(x) === 'bez' || payState(x) === 'erm' ? ' (der Betrag zählt dann nicht mehr in der Kasse)' : ''}. Das kann nicht rückgängig gemacht werden.</p>
      <div class="row"><button class="btn ghost" id="dlc" type="button">Abbrechen</button><button class="btn del" style="margin:0" id="dlok" type="button">Ja, endgültig löschen</button></div>`);
    $('dlc').onclick = closeDialog;
    $('dlok').onclick = () => { act({ op: 'delete', id }); closeDialog(); toast(`<b>${esc(x.first_name)} ${esc(x.last_name)}</b> wurde gelöscht.`); };
  }
  // Hauptknopf: nur offen ↔ bezahlt (regulär). Ermäßigt/Frei/Zurücksetzen über „⋯“.
  function mainPay(x) { return payState(x) === 'offen' ? { paid: true, reduced: false, free: false, amount: prices().regular ?? null } : null; }
  function payClass(x) { const st = payState(x); return st === 'offen' ? (x.present ? 'due' : 'open') : { bez: 'on', erm: 'red', frei: 'free' }[st]; }
  function payText(x) { const st = payState(x); return st === 'frei' ? 'frei' : st === 'erm' ? 'ermäßigt' + (x.amount ? ' ' + eur(x.amount) : '') : st === 'bez' ? 'ja' + (x.amount ? ' ' + eur(x.amount) : '') : 'nein'; }
  // Kassensumme: festgehaltener Betrag, sonst aktueller Preis
  function cash() {
    const pr = prices(), p = people();
    const reg = p.filter(x => payState(x) === 'bez'), red = p.filter(x => payState(x) === 'erm');
    const val = (x, d) => x.amount != null ? Number(x.amount) : (d != null ? Number(d) : NaN);
    const sum = reg.reduce((s, x) => s + val(x, pr.regular), 0) + red.reduce((s, x) => s + val(x, pr.reduced), 0);
    return { reg: reg.length, red: red.length, free: p.filter(x => x.free).length, sum };
  }
  // Mögliche Doppeleinträge: gleicher Vor- und Nachname (ohne Groß/Klein, Akzente, Leerzeichen)
  function dupIds() {
    const by = {}; people().forEach(x => { const k = norm(x.first_name).replace(/\s+/g, '') + '|' + norm(x.last_name).replace(/\s+/g, ''); (by[k] = by[k] || []).push(x.id); });
    return new Set(Object.values(by).filter(a => a.length > 1).flat());
  }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function renderList() {
    const list = $('list'); if (!list) return;
    const q = norm(search.trim());
    let p = people().filter(x => !q || norm(x.first_name + ' ' + x.last_name + ' ' + x.last_name + ' ' + x.first_name).includes(q) || norm(x.ticket).includes(q));
    const done = x => x.present && (x.paid || x.free);
    const dups = dupIds();
    if (filter === 'doppelt') p = p.filter(x => dups.has(x.id));
    if (filter === 'todo') p = p.filter(x => !done(x));
    if (filter === 'vorab') p = p.filter(x => !x.present && x.source === 'vorab');
    if (filter === 'offen') p = p.filter(x => !x.present);
    if (filter === 'da') p = p.filter(x => x.present);
    if (filter === 'zahlen') p = p.filter(x => x.present && !x.paid && !x.free);
    const hidden = people().length - p.length;
    shownIds = new Set(p.map(x => x.id));
    if ($('fbar')) {
      const fl = (FILTERS.find(f => f[0] === filter) || ['', ''])[1];
      $('fbar').innerHTML = filter === 'alle' ? '' : `<div class="fbar"><span>Filter aktiv: <b>${esc(fl)}</b> · zeigt ${p.length} von ${people().length}</span><button class="btn small ghost" type="button" id="fall">Alle anzeigen</button></div>`;
      if ($('fall')) $('fall').onclick = () => { filter = 'alle'; renderEinlass($('main')); };
    }
    if ($('fhint')) $('fhint').textContent = (filter === 'todo' && hidden ? `${hidden} erledigt (da und bezahlt/frei) ausgeblendet.` : '') + (dups.size && filter !== 'doppelt' ? ` ${dups.size} mögliche Doppeleinträge – unter „Filter“ prüfen.` : '') + (filter === 'doppelt' ? 'Gleicher Name mehrfach. Falschen Eintrag antippen › „Entfernen“. Achtung: Es kann auch zwei verschiedene Personen mit gleichem Namen geben.' : '');
    // Sortierung (Name ist immer die zweite Ebene)
    const byName = (a, b) => (a.last_name + ' ' + a.first_name).localeCompare(b.last_name + ' ' + b.first_name, 'de', { sensitivity: 'base' });
    const stIdx = x => { const i = L.STAGES.findIndex(s => s.id === x.stage); return i < 0 ? 99 : i; };
    const scIdx = x => { const f = L.splitSchools(x.school)[0] || ''; const i = L.SCHOOLS.indexOf(f); return (i < 0 ? 50 : i) + ':' + f; };
    const cmp = { name: byName,
      schule: (a, b) => scIdx(a).localeCompare(scIdx(b), 'de', { numeric: true }) || byName(a, b),
      stufe: (a, b) => stIdx(a) - stIdx(b) || byName(a, b),
      vorab: (a, b) => (a.source === 'vorab' ? 0 : 1) - (b.source === 'vorab' ? 0 : 1) || byName(a, b),
      ankunft: (a, b) => (a.present ? 0 : 1) - (b.present ? 0 : 1) || String(b.present_at || '').localeCompare(String(a.present_at || '')) || byName(a, b) }[sortBy] || byName;
    p = p.slice().sort(cmp);
    if (!p.length) {
      list.innerHTML = `<div class="empty">${people().length ? 'Niemand gefunden.' : 'Noch keine Anmeldungen.'}<br><br><button class="btn gold small" id="addEmpty" type="button">+ Person ohne Voranmeldung eintragen</button></div>`;
      $('addEmpty').onclick = () => addDialog(search);
      return;
    }
    list.innerHTML = p.map(x => `<div class="person ${x.present ? 'is-present' : ''}" data-id="${x.id}">
        <button class="who" type="button" data-edit="${x.id}"><div class="nm">${esc(x.last_name)}, ${esc(x.first_name)}</div>
          <div class="sub">${L.stageBadge(x.stage)}<span>${esc(x.school)}</span>${x.photo_ok ? '' : '<span class="tag nofoto">kein Foto</span>'}${x.source === 'vor_ort' ? '<span class="tag">vor Ort</span>' : '<span class="tag pre">✓ vorangemeldet</span>'}${dups.has(x.id) ? '<span class="tag dup">doppelt?</span>' : ''}</div></button>
        <button class="tog da ${x.present ? 'on' : ''}" data-da="${x.id}" aria-pressed="${x.present}">${x.present ? '✓ Da' : 'Da'}</button>
        <div class="paygrp"><button class="tog bz ${payClass(x)}" data-bz="${x.id}">${payLabel(x)}</button><button class="tog more" data-pm="${x.id}" aria-label="Weitere Zahlungsoptionen">⋯</button></div>
      </div>`).join('');
    list.querySelectorAll('[data-da]').forEach(b => b.onclick = () => { const x = people().find(y => y.id === b.dataset.da); act({ op: 'set', id: x.id, present: !x.present }); });
    list.querySelectorAll('[data-bz]').forEach(b => b.onclick = () => { const x = people().find(y => y.id === b.dataset.bz); const v = mainPay(x); if (v) act(Object.assign({ op: 'set', id: x.id }, v)); else payMenu(x.id); });
    list.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => payMenu(b.dataset.pm));
    list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(b.dataset.edit));
  }

  function personFields(p) {
    p = p || {};
    return `<div class="row2"><div class="field"><label for="dfn">Vorname</label><input type="text" id="dfn" value="${esc(p.first_name || '')}"></div>
      <div class="field"><label for="dln">Nachname</label><input type="text" id="dln" value="${esc(p.last_name || '')}"></div></div>
      <div class="row2"><div class="field"><label for="dsc">Schule</label><select id="dsc">${(p.school && !L.SCHOOLS.includes(p.school) ? [p.school] : []).concat(L.SCHOOLS).map(s => `<option ${(p.school || 'Andere Schule / Gast') === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label for="dst">Stufe</label><select id="dst">${L.STAGES.map(s => `<option value="${esc(s.id)}" ${(p.stage || 'Neu') === s.id ? 'selected' : ''}>${esc(s.label || s.id)}${s.stars ? ' ' + '★'.repeat(s.stars) : ''}</option>`).join('')}</select></div></div>
      <label class="check"><input type="checkbox" id="dph" ${p.photo_ok !== false ? 'checked' : ''}> Mit Fotos und Videos einverstanden</label>`;
  }
  function readFields() { return { first_name: $('dfn').value.trim(), last_name: $('dln').value.trim(), school: $('dsc').value, stage: $('dst').value, photo_ok: $('dph').checked }; }

  /* ---------- Selbsteintrag (Gerät wird an die Person gegeben) ---------- */
  function kiosk() {
    const I = window.LGI, t = I.t, OTHER = 'Andere Schule / Gast';
    let box = $('kioskBox');
    if (!box) { box = document.createElement('div'); box.id = 'kioskBox'; box.className = 'kiosk'; document.body.appendChild(box); }
    document.body.classList.add('kiosk-on');
    const close = () => { box.remove(); document.body.classList.remove('kiosk-on'); renderTop(); renderMain(); };
    const form = () => {
      const langs = I.LANGS.filter(l => l.ready);
      box.setAttribute('dir', I.RTL.includes(I.lang) ? 'rtl' : 'ltr');
      box.innerHTML = `<div class="kwrap">
        <div class="khead"><h2>${t('kioskTitle')}</h2>${langs.length > 1 ? `<select id="klang" aria-label="${t('langLabel')}">${langs.map(l => `<option value="${l.id}" ${l.id === I.lang ? 'selected' : ''}>${l.name}</option>`).join('')}</select>` : ''}</div>
        <p class="muted small" style="margin:0">${t('kioskIntro')}</p>
        <div class="row2"><div class="field"><label for="kfn">${t('firstName')}</label><input type="text" id="kfn" autocomplete="off"></div>
        <div class="field"><label for="kln">${t('lastName')}</label><input type="text" id="kln" autocomplete="off"></div></div>
        <fieldset class="field"><legend class="legend">${t('school')} <span class="muted small">${t('schoolHint')}</span></legend><div class="schools">${L.SCHOOLS.map(s => `<label class="opt"><input type="checkbox" name="ksc" value="${esc(s)}"><span>${esc(s === OTHER ? t('schoolOther') : s === L.SCHOOLS[5] ? t('schoolNone') : s)}</span></label>`).join('')}</div></fieldset>
        <div class="field" id="kother" hidden><label for="kso">${t('otherSchoolName')}</label><input type="text" id="kso" maxlength="100"></div>
        <fieldset class="field"><legend class="legend">${t('stage')}</legend><div class="stages">${L.STAGES.map(s => `<label class="opt"><input type="radio" name="kst" value="${esc(s.id)}"><span>${L.stageBadge(s.id)}</span></label>`).join('')}</div></fieldset>
        <p class="muted small" style="margin:0">${t('photoNotice')}</p>
        <p class="muted small" style="margin:0">${t('kioskPrivacy')}</p>
        <p class="err" id="kerr" hidden></p>
        <button class="btn block" id="ksend" type="button">${t('kioskSubmit')}</button>
        <button class="btn ghost small hold" id="kexit" type="button"><span>Zurück zur Liste: 3 Sek. gedrückt halten</span></button>
      </div>`;
      if ($('klang')) $('klang').onchange = e => { I.set(e.target.value); form(); };
      box.querySelectorAll('input[name=ksc]').forEach(c => c.onchange = () => { $('kother').hidden = !box.querySelector(`input[name=ksc][value="${OTHER}"]:checked`); });
      holdExit($('kexit'));
      $('ksend').onclick = () => {
        const fn = $('kfn').value.trim(), ln = $('kln').value.trim();
        const sch = [...box.querySelectorAll('input[name=ksc]:checked')].map(c => c.value);
        const st = (box.querySelector('input[name=kst]:checked') || {}).value;
        const miss = [];
        if (!fn) miss.push(t('firstName')); if (!ln) miss.push(t('lastName')); if (!sch.length) miss.push(t('school')); if (!st) miss.push(t('stage'));
        if (miss.length) { $('kerr').textContent = t('missing', { list: miss.join(', ') }); $('kerr').hidden = false; return; }
        const other = $('kso').value.trim().slice(0, 100);
        const school = L.joinSchools(sch.map(x => x === OTHER && other ? other : x)).slice(0, 300);
        const free = st === 'Ehrenmitglied';
        act({ op: 'add', id: L.uuid(), event_id: data.event_id, present: true, paid: false, free, reduced: false, amount: free ? 0 : null, first_name: fn.slice(0, 60), last_name: ln.slice(0, 60), school, stage: st, photo_ok: true, note: 'selbst eingetragen' });
        box.innerHTML = `<div class="kwrap kdone"><div class="kcheck">✓</div><h2>${esc(t('kioskDone', { name: fn }))}</h2><p>${t('kioskReturn')}</p>
          <button class="btn gold block" id="knext" type="button">${t('kioskNext')}</button>
          <button class="btn ghost small hold" id="kexit" type="button"><span>Zurück zur Liste: 3 Sek. gedrückt halten</span></button></div>`;
        $('knext').onclick = form; holdExit($('kexit'));
      };
    };
    // Statt Passwort: Knopf 3 Sekunden gedrückt halten (versehentlich passiert das keinem Gast)
    const holdExit = b => {
      let t = null;
      const stop = () => { clearTimeout(t); b.classList.remove('holding'); };
      b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('holding'); t = setTimeout(() => { stop(); I.set('de'); close(); }, 3000); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
      b.addEventListener('contextmenu', e => e.preventDefault());
    };
    form(); window.scrollTo(0, 0);
  }

  function addDialog(prefillName) {
    const parts = (prefillName || '').trim().split(/\s+/);
    openDialog(`<h2>Person ohne Voranmeldung</h2>${personFields({ first_name: parts.length > 1 ? parts.slice(0, -1).join(' ') : parts[0] || '', last_name: parts.length > 1 ? parts[parts.length - 1] : '', photo_ok: true })}
      <div class="field"><label for="dpay">Bezahlung</label><select id="dpay"><option value="offen">noch offen</option><option value="bez">bezahlt${prices().regular != null ? ' (' + eur(prices().regular) + ')' : ''}</option><option value="erm">ermäßigt${prices().reduced != null ? ' (' + eur(prices().reduced) + ')' : ''}</option><option value="frei">frei (z. B. Ehrenmitglied, eingeladener Gast)</option></select></div>
      <p class="err" id="derr" hidden></p>

  function exportCsv(emergency) {
    const e = event();
    const rows = [['Nachname', 'Vorname', 'Schule', 'Stufe', 'Fotos ok', 'Da', 'Da seit', 'Bezahlt', 'Angemeldet', 'Code']];

    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const ts = new Date().toLocaleString('de-DE').replace(/[^0-9]+/g, '-').replace(/-$/, '');
    const name = (emergency ? 'Notfallkopie_' + ts + (queue.length ? '_' + queue.length + '-ungesendet' : '') : 'Teilnehmer_' + ((e && e.event_date) || 'Lehrgang')) + '.csv';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    // iPad/iPhone: Teilen-Menü („In Dateien sichern“, Mail, AirDrop). Computer: normaler Download.
    const touch = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    try {
      const file = new File([blob], name, { type: 'text/csv' });
      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(() => toast('Datei weitergegeben: ' + esc(name)), err => { if (err && err.name !== 'AbortError') download(); });
        return;
      }
    } catch (err) {}
    download();
    function download() {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast('Gespeichert als <b>' + esc(name) + '</b>' + (touch ? ' (Dateien-App › Downloads)' : ' (Ordner „Downloads“)'));
    }
  }

      ${albumMsg ? `<div class="hint">${esc(albumMsg)}</div>` : ''}
      ${!s.view_until || !s.upload_until ? '<div class="stale">⚠ Für diesen Lehrgang fehlt noch, wie lange das Fotoalbum offen ist. Bitte unten „Hochladen bis“ und „Ansehen bis“ eintragen. Vorher lassen sich keine Kärtchen und kein Plakat drucken.</div>' : ''}
      ${hidden.length ? `<div class="card"><h2>Gemeldet / ausgeblendet (${hidden.length})</h2>
        <p class="muted small" style="margin:0">Diese Bilder sieht gerade niemand. Prüfen: wieder zeigen oder endgültig löschen.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px">${hidden.map(tile).join('')}</div></div>` : ''}
      <form class="card" id="alf"><h2>Fotoalbum – Einstellungen</h2>
        <div class="row2"><div class="field"><label for="aup">Hochladen bis</label><input type="date" id="aup" value="${esc(s.upload_until || '')}"></div>
        <div class="field"><label for="avw">Ansehen bis (danach automatisch gelöscht)</label><input type="date" id="avw" value="${esc(s.view_until || '')}"></div></div>
        <div class="field"><label for="afilm">Link zum Film vom Filmer (optional)</label><input type="url" id="afilm" value="${esc(s.film_url || '')}" placeholder="https://…"></div>
        <div class="field"><label for="awel">Begrüßung oben im Album (optional)</label><textarea id="awel" rows="4" maxlength="1000" placeholder="z. B. Danke an alle für den tollen Lehrgang! Nächster Termin: … Links (https://…) werden antippbar." style="width:100%;font:inherit;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(s.welcome || '')}</textarea></div>
        <p class="err" id="aerr" hidden></p>
        <div style="display:flex;justify-content:flex-end"><button class="btn" type="submit">Speichern</button></div>
      </form>
      <div class="card"><h2>Kärtchen für den Lehrgang</h2>
        <p class="muted small" style="margin:0">Jede Person bekommt am Einlass ein Kärtchen. Der QR-Code darauf führt direkt ins Album dieses Lehrgangs – ohne Passwort. Der Zugangscode wird automatisch erzeugt und steckt im QR-Code.</p>
        <div class="tools2"><button class="btn small" type="button" id="acard">Kärtchen drucken (10 pro Seite)</button><button class="btn small" type="button" id="apr">Plakat drucken (zum Abfotografieren)</button><button class="btn ghost small" type="button" id="acp">Album-Link kopieren</button></div>
        <p class="muted small" style="margin:0">Anzahl Blätter im Druckfenster bei „Kopien“ einstellen (z. B. 6 Kopien = 60 Kärtchen).</p>
        <details><summary class="muted small" style="cursor:pointer">Zugangscode: ${esc(s.code || '–')}</summary>
          <p class="muted small" style="margin:8px 0">Nur ändern, wenn der Code in falsche Hände geraten ist. <b>Alle bisher gedruckten Kärtchen funktionieren danach nicht mehr.</b></p>
          <button class="btn ghost small danger" type="button" id="anew">Neuen Zugangscode erzeugen</button></details>
      </div>
      <div class="card"><h2>Speicher</h2>
        <div style="height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct > 85 ? '#c4213a' : 'var(--gold)'}"></i></div>
        <p class="muted small" style="margin:0">${mb(album.usage || 0)} von ${mb(album.limit || 0)} belegt (${pct} %) · ${shown.filter(x => x.kind === 'photo').length} Fotos, ${shown.filter(x => x.kind === 'video').length} Clips sichtbar</p>
      </div>
      <div class="card"><h2>Alle sichtbaren Bilder (${shown.length})</h2>
        ${shown.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px">${shown.map(tile).join('')}</div>` : '<p class="muted" style="margin:0">Noch keine Bilder.</p>'}
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><a class="btn ghost small" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">Album wie Teilnehmende öffnen</a><button class="btn ghost small danger" type="button" id="aclr">Album leeren</button></div>
        <p class="muted small" style="margin:0">„Album leeren“ löscht alle Bilder dieses Lehrgangs endgültig – z. B. Testbilder vor dem Lehrgang.</p>
      </div>
      <div class="poster printing print-only" id="apost" style="display:none"></div>`;
    $('alf').onsubmit = async ev => {
      ev.preventDefault();
      const st = { upload_until: $('aup').value || null, view_until: $('avw').value || null, film_url: $('afilm').value.trim(), welcome: $('awel').value.trim() };
      const err = t => { $('aerr').textContent = t; $('aerr').hidden = false; };
      if (st.film_url && !/^https:\/\//i.test(st.film_url)) return err('Der Film-Link muss mit https:// beginnen.');
      if (!st.view_until) return err('Bitte „Ansehen bis“ eintragen – so lange ist das Album offen, danach wird alles gelöscht.');
      if (!st.upload_until) return err('Bitte „Hochladen bis“ eintragen.');
      if (st.upload_until && st.view_until && st.upload_until > st.view_until) return err('„Hochladen bis“ muss vor „Ansehen bis“ liegen.');
      try { album = await api.adminAlbumSave(key, eventId, st); album._ev = eventId; albumMsg = 'Gespeichert.'; drawAlbum(m); }
      catch (e) { err(e.code === 'network' ? 'Keine Verbindung.' : 'Speichern hat nicht geklappt.'); }
    };
    const copy = async (txt, btn) => { const old = btn.textContent; try { await navigator.clipboard.writeText(txt); btn.textContent = '✓ Kopiert'; } catch (e) { prompt('Bitte kopieren:', txt); } setTimeout(() => { btn.textContent = old; }, 1800); };
    $('acp').onclick = () => copy(link, $('acp'));
    let armedN = false;
    $('anew').onclick = async () => {
      if (!armedN) { armedN = true; $('anew').textContent = 'Wirklich? Alte Kärtchen werden ungültig'; return; }
      try { album = await api.adminAlbumNewCode(key, eventId); album._ev = eventId; albumMsg = 'Neuer Zugangscode erzeugt. Bitte neue Kärtchen drucken.'; drawAlbum(m); } catch (e) { albumMsg = 'Hat nicht geklappt.'; drawAlbum(m); }
    };
    $('acard').onclick = () => {
      if (!s.view_until || !s.upload_until) { albumMsg = '⚠ Bitte zuerst „Hochladen bis“ und „Ansehen bis“ eintragen und speichern – die Daten stehen auf Kärtchen und Plakat.'; drawAlbum(m); const f = $('avw'); if (f) { f.focus(); f.scrollIntoView({ block: 'center' }); } return; }
      const p = $('apost'); p.style.display = ''; p.className = 'printing print-only cards';
      const d = s.event_date ? new Date(s.event_date + 'T12:00').toLocaleDateString('de-DE') : '';
      const until = s.view_until ? new Date(s.view_until + 'T12:00').toLocaleDateString('de-DE') : '';
      const qr = window.makeQrSvg(link, { level: 'M', border: 1 });
      const one = `<div class="cardp"><div>${qr}</div><div><div class="t1">Fotos &amp; Videos</div><div class="t2">${esc(s.title || 'Slowmotion Lehrgang')}${d ? ' · ' + d : ''}</div>
        <div class="t3">Scannen: Bilder ansehen, herunterladen und eigene hochladen.${until ? `<br>Offen bis <b>${until}</b>.` : ''}</div>
        <div class="t4">Tipp: Kärtchen abfotografieren – der Code funktioniert auch vom Foto.</div></div></div>`;
      p.innerHTML = one.repeat(10);
      document.querySelectorAll('.printing').forEach(x => { if (x !== p) x.classList.remove('printing'); });
      window.print(); setTimeout(() => { p.style.display = 'none'; p.className = 'poster printing print-only'; }, 500);
    };
    $('apr').onclick = () => {
      if (!s.view_until || !s.upload_until) { albumMsg = '⚠ Bitte zuerst „Hochladen bis“ und „Ansehen bis“ eintragen und speichern – die Daten stehen auf Kärtchen und Plakat.'; drawAlbum(m); const f = $('avw'); if (f) { f.focus(); f.scrollIntoView({ block: 'center' }); } return; }
      const p = $('apost'); p.style.display = ''; p.style.padding = '0';
      const dd = s.event_date ? new Date(s.event_date + 'T12:00').toLocaleDateString('de-DE') : '';
      const vu = s.view_until ? new Date(s.view_until + 'T12:00').toLocaleDateString('de-DE') : '';
      p.innerHTML = `<div style="border:1.5mm solid #111;border-radius:6mm;padding:10mm 8mm;display:grid;gap:5mm;justify-items:center;width:100%">
        <div style="font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-weight:800">Slowmotion · ${esc(s.title || 'Lehrgang')}${dd ? ' · ' + dd : ''}</div>
        <div class="p-title">Fotos &amp; Videos</div>
        <div style="font-size:20px;font-weight:800">Kein Kärtchen bekommen?<br>Einfach diesen QR-Code abfotografieren!</div>
        <div class="p-qr">${window.makeQrSvg(link, { level: 'M', border: 2 })}</div>
        <div style="font-size:15px;max-width:460px">Mit der Handykamera scannen – oder später das Foto davon öffnen.<br>Bilder ansehen, herunterladen und eigene Fotos &amp; kurze Clips hochladen.</div>
        ${vu ? `<div style="font-size:16px;font-weight:800">Offen bis ${vu}</div>` : ''}
        <div style="font-size:12px;color:#444">Wer nicht auf einem Bild sein möchte: Bild öffnen › „Bitte entfernen“.</div></div>`;
      document.querySelectorAll('.printing').forEach(x => { if (x !== p) x.classList.remove('printing'); });
      window.print(); setTimeout(() => { p.style.display = 'none'; }, 500);
    };
    let armed = false;
    $('aclr').onclick = async () => {
      if (!armed) { armed = true; $('aclr').textContent = 'Wirklich alles löschen?'; setTimeout(() => { if ($('aclr')) { armed = false; $('aclr').textContent = 'Album leeren'; } }, 4000); return; }
      try { album = await api.adminAlbumClear(key, eventId); album._ev = eventId; await purgeAlbum(); albumMsg = 'Album geleert.'; drawAlbum(m); } catch (e) { albumMsg = 'Hat nicht geklappt.'; drawAlbum(m); }
    };
    m.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => mediaDialog(m, items.find(x => x.id === b.dataset.mi)));
  }
  function mediaDialog(m, x) {
    if (!x) return;
    const src = api.mediaUrl(x.path);
    openDialog(`<h2 style="margin:0">${x.kind === 'video' ? 'Clip' : 'Foto'} von ${esc(x.uploader || 'Gast')}</h2>
      <div style="background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;max-height:55vh">${x.kind === 'video' ? `<video src="${esc(src)}" controls playsinline style="max-width:100%;max-height:55vh"></video>` : `<img src="${esc(src)}" alt="" style="max-width:100%;max-height:55vh;display:block">`}</div>
      <div class="field"><label for="mcap">Bildunterschrift (optional, sehen alle)</label><div style="display:flex;gap:6px"><input id="mcap" maxlength="300" value="${esc(x.caption || '')}" placeholder="z. B. Befreiung aus dem Würgegriff" style="flex:1;min-width:0"><button class="btn small" type="button" id="mcaps">Speichern</button></div></div>
      <p class="muted small" style="margin:0">${new Date(x.created_at).toLocaleString('de-DE')}${x.reported ? ' · <b style="color:#ff8f9c">gemeldet („Bitte entfernen“)</b>' : ''}</p>
      <div class="row">
        ${x.status === 'hidden' ? '<button class="btn small" type="button" data-ms="ok">Wieder zeigen</button>' : '<button class="btn ghost small" type="button" data-ms="hidden">Ausblenden</button>'}
        <button class="btn ghost small danger" type="button" id="mdel">Endgültig löschen</button>
        <button class="btn ghost small" type="button" id="mcl">Schließen</button>
      </div>`);
    const set = async st => { try { album = await api.adminMediaSet(key, eventId, x.id, st); album._ev = eventId; if (st === 'deleted') await purgeAlbum(); closeDialog(); drawAlbum(m); } catch (e) { closeDialog(); albumMsg = e.code === 'network' ? 'Keine Verbindung.' : 'Hat nicht geklappt.'; drawAlbum(m); } };
    dlgBody.querySelectorAll('[data-ms]').forEach(b => b.onclick = () => set(b.dataset.ms));
    let armed = false;
    $('mdel').onclick = () => { if (!armed) { armed = true; $('mdel').textContent = 'Wirklich löschen?'; return; } set('deleted'); };
    $('mcl').onclick = closeDialog;
    $('mcaps').onclick = async () => { $('mcaps').disabled = true; try { album = await api.adminMediaCaption(key, eventId, x.id, $('mcap').value); album._ev = eventId; closeDialog(); albumMsg = 'Bildunterschrift gespeichert.'; drawAlbum(m); } catch (e) { $('mcaps').disabled = false; $('mcaps').textContent = e.code === 'network' ? 'Kein Netz' : 'Fehler'; } };
  }

  function plusDays(d, n) { if (!d) return ''; const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  /* ---------- Lehrgänge ---------- */
  function renderEvents(m, editId) {
    const evs = (data && data.events) || [];
    const ed = evs.find(x => x.id === editId) || {};
    m.innerHTML = `<div class="card"><h2>Lehrgänge</h2>
      <div class="table-wrap"><table><thead><tr><th>Datum</th><th>Titel</th><th></th></tr></thead><tbody>
      ${evs.map(x => `<tr><td>${esc(x.event_date || '–')}</td><td>${esc(x.title)} ${x.active ? '<span class="tag" style="color:var(--ok)">Voranmeldung offen</span>' : ''} ${x.id === data.event_id ? '<span class="tag">hier angezeigt</span>' : ''}</td>
        <td class="n"><button class="btn ghost small" data-show="${x.id}" type="button">Anzeigen</button> <button class="btn ghost small" data-ed="${x.id}" type="button">Bearbeiten</button></td></tr>`).join('')}
      </tbody></table></div></div>
      <form class="card" id="evf"><h2>${ed.id ? 'Lehrgang bearbeiten' : 'Neuen Lehrgang anlegen'}</h2>
        <div class="field"><label for="et">Titel</label><input type="text" id="et" value="${esc(ed.title || '')}" placeholder="z. B. Prüfungslehrgang"></div>
        <div class="row2"><div class="field"><label for="ed">Datum</label><input type="date" id="ed" value="${esc(ed.event_date || '')}"></div>
        <div class="field"><label for="eti">Uhrzeit</label><input type="text" id="eti" value="${esc(ed.time_text || '')}" placeholder="13:30–17:00 Uhr"></div></div>
        <div class="field"><label for="el">Ort (Halle, Straße, Ort mit Kommas getrennt)</label><input type="text" id="el" value="${esc(ed.location || '')}"></div>
        <div class="row2"><div class="field"><label for="eup">📷 Fotoalbum: Hochladen bis</label><input type="date" id="eup" value="${esc(ed.album_upload_until || plusDays(ed.event_date, 14))}"></div>
        <div class="field"><label for="evw">📷 Fotoalbum: Ansehen bis</label><input type="date" id="evw" value="${esc(ed.album_view_until || plusDays(ed.event_date, 43))}"></div></div>
        <p class="muted small" style="margin:-8px 0 0">Wird mit dem Datum automatisch vorgeschlagen: 2 Wochen hochladen, 6 Wochen ansehen – danach wird das Album gelöscht. Steht so auf Kärtchen und Plakat. Längere Zeiten nur nach Absprache mit den Veranstaltern.</p>
        <label class="check"><input type="checkbox" id="ea" ${ed.active ? 'checked' : ''}> Für diesen Lehrgang ist die Voranmeldung offen (nur einer gleichzeitig)</label>
        <p class="err" id="eerr" hidden></p>
        <div class="row" style="display:flex;gap:8px;justify-content:flex-end">${ed.id ? '<button class="btn ghost" id="enew" type="button">Neu statt bearbeiten</button>' : ''}<button class="btn" type="submit">Speichern</button></div>
        <p class="muted small" style="margin:0">Braucht Internet.</p></form>`;
    m.querySelectorAll('[data-show]').forEach(b => b.onclick = async () => { eventId = b.dataset.show; L.store('lg_event', eventId); if (queue.length) await sync(); try { data = await api.adminData(key, eventId); saveLocal(); markSynced(); } catch (e) {} tab = 'einlass'; renderTop(); renderMain(); });
    m.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => renderEvents(m, b.dataset.ed));
    let touched = !!(ed.album_upload_until || ed.album_view_until);
    $('eup').oninput = $('evw').oninput = () => { touched = true; };
    $('ed').onchange = () => { if (!touched || !$('eup').value || !$('evw').value) { $('eup').value = plusDays($('ed').value, 14); $('evw').value = plusDays($('ed').value, 43); } };
    if ($('enew')) $('enew').onclick = () => renderEvents(m);
    $('evf').onsubmit = async ev => {
      ev.preventDefault();
      const e = { id: ed.id || '', title: $('et').value.trim(), event_date: $('ed').value, time_text: $('eti').value.trim(), location: $('el').value.trim(), active: $('ea').checked, album_upload_until: $('eup').value || null, album_view_until: $('evw').value || null };
      if (!e.title) { $('eerr').textContent = 'Bitte einen Titel eintragen.'; $('eerr').hidden = false; return; }
      if (!e.event_date) { $('eerr').textContent = 'Bitte ein Datum eintragen – daraus ergibt sich auch, wie lange das Fotoalbum offen ist.'; $('eerr').hidden = false; return; }
      if (e.album_upload_until && e.album_view_until && e.album_upload_until > e.album_view_until) { $('eerr').textContent = 'Fotoalbum: „Hochladen bis“ muss vor „Ansehen bis“ liegen.'; $('eerr').hidden = false; return; }
      try { const d = await api.adminSaveEvent(key, e); data = d; eventId = d.event_id; L.store('lg_event', eventId); saveLocal(); markSynced(); renderTop(); renderEvents(m); }
      catch (x) { $('eerr').textContent = x.code === 'network' ? 'Keine Verbindung. Lehrgänge lassen sich nur mit Internet anlegen.' : 'Speichern hat nicht geklappt.'; $('eerr').hidden = false; }
    };
  }

  /* ---------- Start ---------- */
  if (!key) showLogin();
  else if (!data) { showLogin(); }
  else start();
})();
</script>
</body>
</html>
