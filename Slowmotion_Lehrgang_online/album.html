<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0b0c">
<meta property="og:title" content="Slowmotion – Fotos & Videos vom Lehrgang">
<meta property="og:description" content="Nur für Teilnehmende. Mit deinem Code öffnen.">
<title>Slowmotion Lehrgang – Fotos &amp; Videos</title>
<link rel="stylesheet" href="style.css">
<style>
  .ahead { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding-block: 18px 6px; }
  .ahead .shield { width: 56px; height: 56px; }
  .ahead h1 { margin: 0; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 26px; line-height: 1; }
  .ahead .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  main { display: grid; gap: 14px; padding-block: 10px 60px; }
  .ainfo { font-size: 14px; color: var(--muted); }
  .ainfo b { color: var(--gold); }
  .upl { display: grid; gap: 10px; }
  .upbtn { position: relative; display: grid; place-items: center; min-height: 64px; border-radius: 14px; background: var(--gold); color: #1c1307; font-weight: 900; font-size: 18px; cursor: pointer; text-align: center; padding: 10px; }
  .upbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .rules { font-size: 13px; color: var(--muted); margin: 0; }
  .queue { display: grid; gap: 6px; }
  .qi { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 13px; }
  .qi img, .qi .ph { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #000; display: grid; place-items: center; }
  .qi .st { color: var(--muted); overflow-wrap: anywhere; }
  .qi .st.bad { color: #ff8f9c; }
  .qi .st.ok { color: var(--ok); }
  .bar0 { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar0 i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  .chips2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip2 { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 7px 13px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .chip2[aria-pressed="true"] { background: var(--red-2); border-color: transparent; color: #fff; }
  .chips2 .cnt { margin-left: auto; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: var(--panel-2); border-radius: 6px; overflow: hidden; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; }
  .tile .dur { position: absolute; right: 5px; bottom: 4px; font-size: 11px; font-weight: 800; color: #fff; background: rgba(0,0,0,.6); border-radius: 4px; padding: 0 4px; }
  .tile .me { position: absolute; left: 5px; top: 4px; font-size: 10px; font-weight: 800; color: #1c1307; background: var(--gold); border-radius: 4px; padding: 0 4px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .film { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  /* Großansicht */
  .viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
  .vtop { display: flex; justify-content: space-between; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 8px; gap: 10px; }
  .vtop button, .vnav { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 99px; min-width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
  .vmid { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; touch-action: pan-y; }
  .vmid img, .vmid video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .vnav { position: absolute; top: 50%; transform: translateY(-50%); }
  .vnav.prev { left: 8px; } .vnav.next { right: 8px; }
  .vbot { padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 10px; background: linear-gradient(transparent, rgba(0,0,0,.85) 30%); }
  .vmeta { font-size: 13px; color: #d8cfcc; }
  .vacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .vacts .btn { flex: 1 1 140px; text-align: center; text-decoration: none; }
  .vtip { font-size: 12px; color: #a99f9b; margin: 0; }
  .gate { max-width: 440px; margin: 0 auto; }
  .codein { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <header class="ahead">
    <div class="shield" id="shield"></div>
    <div><h1>Fotos &amp; Videos</h1><div class="sub" id="sub">Slowmotion Lehrgang</div></div>
  </header>
  <div class="demo" id="demoNote" hidden>Vorschau-Modus: Bilder bleiben nur in diesem Browser.</div>
  <main id="main"><div class="card"><p class="muted">Wird geladen …</p></div></main>
  <footer>Slowmotion Kampfsystem · <a href="index.html">Zur Lehrgangsseite</a></footer>
</div>

<script src="config.js"></script>
<script src="lang.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const L = window.LG, api = L.api, esc = L.esc;
  const $ = id => document.getElementById(id);
  const main = $('main');
  $('shield').innerHTML = L.SHIELD;
  if (!L.online) $('demoNote').hidden = false;
  L.registerSW();

  function clientId() { let c = L.store('lg_client'); if (!c) { c = L.uuid(); L.store('lg_client', c); } return c; }
  const client = clientId();
  let code = null, data = null, filter = 'alle', pollT = null, uploading = 0;

  /* ---------- Code finden: Link, gespeichert oder Voranmeldung auf diesem Gerät ---------- */
  async function findCode() {
    const h = decodeURIComponent((location.hash || '').replace(/^#(code=)?/, '')).trim();
    if (h) { L.store('lg_album_code', h); history.replaceState(null, '', location.pathname + location.search); return h; }
    const saved = L.store('lg_album_code'); if (saved) return saved;
    try {
      const ev = await api.publicEvent();
      const list = ev ? L.storeJson('lg_tickets_' + ev.id) : null;
      if (Array.isArray(list) && list[0] && list[0].ticket) return list[0].ticket;
    } catch (e) {}
    return null;
  }

  function showGate(msg) {
    stopPoll();
    main.innerHTML = `<form class="card gate" id="gf">
      <h2 style="margin:0">Album öffnen</h2>
      <p style="margin:0">📷 Bitte scanne den <b>QR-Code auf deinem Kärtchen</b> vom Lehrgang mit der Handykamera – dann bist du direkt drin.</p>
      <p class="muted small" style="margin:0">Vorab angemeldet? Dann kannst du auch deinen persönlichen Code eingeben (<b>SM-…</b>, steht unter deinem Anmelde-QR-Code).</p>
      <div class="field"><label for="ci">Persönlicher Code</label><input id="ci" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SM-ABC123"></div>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <button class="btn block" type="submit">Öffnen</button>
    </form>`;
    $('gf').onsubmit = ev => { ev.preventDefault(); const v = $('ci').value.trim(); if (!v) return; code = v; L.store('lg_album_code', v); load(); };
  }

  async function load(quiet) {
    if (!quiet) main.innerHTML = '<div class="card"><p class="muted">Wird geladen …</p></div>';
    try {
      data = await api.albumList(code, client);
    } catch (e) {
      if (quiet) return;
      if (e.code === 'bad_code') { L.store('lg_album_code', null); return showGate('Dieser Code stimmt nicht. Bitte prüfen.'); }
      if (e.code === 'album_closed') { L.store('lg_album_code', null); main.innerHTML = '<div class="card"><h2 style="margin:0">Das Album ist geschlossen</h2><p class="muted" style="margin:0">Die Fotos waren nur für eine begrenzte Zeit sichtbar und sind inzwischen gelöscht.</p></div>'; return; }
      main.innerHTML = `<div class="card"><h2 style="margin:0">Keine Verbindung</h2><p class="muted" style="margin:0">Das Album braucht Internet. Bitte später noch einmal versuchen.</p><div><button class="btn" id="rt">Erneut versuchen</button></div></div>`;
      $('rt').onclick = () => load(); return;
    }
    if (quiet && uploading) return; // nicht mitten im Hochladen neu zeichnen
    render();
    startPoll();
  }
  function startPoll() { stopPoll(); pollT = setInterval(() => { if (!document.hidden && !viewerOpen()) load(true); }, 30000); }
  function stopPoll() { if (pollT) clearInterval(pollT); pollT = null; }

  const fmtDay = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) : '';
  const fmtTime = s => new Date(s).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const mb = n => (n / 1048576).toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' MB';

  function visibleItems() {
    const it = data.items || [];
    if (filter === 'foto') return it.filter(x => x.kind === 'photo');
    if (filter === 'clip') return it.filter(x => x.kind === 'video');
    if (filter === 'meine') return it.filter(x => x.mine);
    return it;
  }

  function render() {
    const e = data.event;
    $('sub').textContent = [e.title, e.event_date ? L.fmtDate(e.event_date) : ''].filter(Boolean).join(' · ');
    const items = data.items || [], nP = items.filter(x => x.kind === 'photo').length, nV = items.length - nP, nMine = items.filter(x => x.mine).length;
    const needName = !data.name;
    main.innerHTML = `
      <div class="ainfo">${e.can_upload ? `Hochladen bis <b>${fmtDay(e.upload_until)}</b> · ` : ''}Ansehen bis <b>${fmtDay(e.view_until)}</b> – bitte vorher herunterladen, danach wird alles gelöscht.</div>
      ${e.film_url ? `<a class="btn ghost block film" href="${esc(e.film_url)}" target="_blank" rel="noopener">🎬 Film vom Lehrgang (Profi-Aufnahmen)</a>` : ''}
      ${e.can_upload ? `<section class="card upl">
        ${needName ? `<div class="field"><label for="nm">Dein Vorname (steht bei deinen Bildern)</label><input id="nm" maxlength="40" autocomplete="given-name" value="${esc(L.store('lg_album_name') || '')}"></div>` : `<div class="muted small">Du lädst hoch als <b style="color:var(--ink)">${esc(data.name)}</b></div>`}
        <label class="upbtn">📷 Fotos &amp; Clips hinzufügen<input type="file" id="fi" accept="image/*,video/*" multiple></label>
        <p class="rules">Nur Bilder vom Lehrgang. Clips bis 30 Sekunden. Fotos werden automatisch verkleinert, Standortdaten entfernt. Wer auf einem Bild nicht zu sehen sein möchte: Bild antippen › <b>Bitte entfernen</b>.</p>
        <div class="queue" id="queue"></div>
      </section>` : '<div class="hint">Hochladen ist beendet. Ansehen und Herunterladen geht noch bis ' + fmtDay(e.view_until) + '.</div>'}
      <div class="chips2">${[['alle', 'Alle'], ['foto', `Fotos (${nP})`], ['clip', `Clips (${nV})`], ['meine', `Meine (${nMine})`]].map(([k, v]) => `<button class="chip2" type="button" data-f="${k}" aria-pressed="${filter === k}">${v}</button>`).join('')}</div>
      <div id="grid"></div>
      <p class="muted small" style="text-align:center;margin:8px 0 0"><a href="#" id="other">Mit anderem Code öffnen</a></p>`;
    main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; main.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderGrid(); });
    $('other').onclick = ev => { ev.preventDefault(); L.store('lg_album_code', null); showGate(); };
    if ($('nm')) $('nm').oninput = () => L.store('lg_album_name', $('nm').value.trim());
    if ($('fi')) $('fi').onchange = () => { const files = [...$('fi').files]; $('fi').value = ''; addFiles(files); };
    renderGrid();
  }

  function renderGrid() {
    const g = $('grid'); if (!g) return;
    const it = visibleItems();
    if (!it.length) { g.innerHTML = `<div class="empty">${filter === 'meine' ? 'Du hast noch nichts hochgeladen.' : 'Noch keine Bilder. Mach den Anfang! 📷'}</div>`; return; }
    g.className = 'grid';
    g.innerHTML = it.map((x, i) => {
      const src = api.mediaUrl(x.thumb || (x.kind === 'photo' ? x.path : ''));
      return `<button class="tile" type="button" data-i="${i}" aria-label="${x.kind === 'video' ? 'Clip' : 'Foto'} von ${esc(x.uploader)}">
        ${src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async">` : ''}
        ${x.kind === 'video' ? `<span class="play">▶</span>${x.duration ? `<span class="dur">0:${String(Math.round(x.duration)).padStart(2, '0')}</span>` : ''}` : ''}
        ${x.mine ? '<span class="me">Meins</span>' : ''}</button>`;
    }).join('');
    g.querySelectorAll('[data-i]').forEach(b => b.onclick = () => openViewer(+b.dataset.i));
  }

  /* ---------- Großansicht ---------- */
  let vEl = null, vIdx = 0;
  const viewerOpen = () => !!vEl;
  function fileName(x, i) {
    const ext = (x.path.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '');
    return `Slowmotion-Lehrgang-${data.event.event_date || ''}-${String(i + 1).padStart(3, '0')}.${ext}`;
  }
  function openViewer(i) {
    vIdx = i;
    if (!vEl) {
      vEl = document.createElement('div'); vEl.className = 'viewer'; vEl.setAttribute('role', 'dialog'); vEl.setAttribute('aria-modal', 'true');
      document.body.appendChild(vEl); document.body.style.overflow = 'hidden';
      document.addEventListener('keydown', onKey);
    }
    drawViewer();
  }
  function closeViewer() { if (!vEl) return; vEl.remove(); vEl = null; document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); }
  function step(d) { const n = visibleItems().length; if (!n) return; vIdx = (vIdx + d + n) % n; drawViewer(); }
  function drawViewer() {
    const it = visibleItems(), x = it[vIdx]; if (!x) return closeViewer();
    const src = api.mediaUrl(x.path), isV = x.kind === 'video';
    const isIOS = /iPhone|iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    vEl.innerHTML = `<div class="vtop"><span style="font-size:14px">${vIdx + 1} / ${it.length}</span><button type="button" id="vx" aria-label="Schließen">✕</button></div>
      <div class="vmid" id="vm">${isV ? `<video src="${esc(src)}" controls playsinline preload="metadata" ${x.thumb ? `poster="${esc(api.mediaUrl(x.thumb))}"` : ''}></video>` : `<img src="${esc(src)}" alt="">`}
        ${it.length > 1 ? '<button class="vnav prev" type="button" id="vp" aria-label="Vorheriges">‹</button><button class="vnav next" type="button" id="vn" aria-label="Nächstes">›</button>' : ''}</div>
      <div class="vbot">
        <div class="vmeta">${isV ? 'Clip' : 'Foto'} von <b>${esc(x.uploader || 'Gast')}</b> · ${fmtTime(x.created_at)}</div>
        <div class="vacts">
          <a class="btn gold small" href="${esc(api.downloadUrl(x.path, fileName(x, vIdx)))}" download="${esc(fileName(x, vIdx))}" target="_blank" rel="noopener">⬇︎ Herunterladen</a>
          ${x.mine ? '<button class="btn ghost small" type="button" id="vdel">Mein Bild löschen</button>' : '<button class="btn ghost small" type="button" id="vrep">Bitte entfernen</button>'}
        </div>
        ${isIOS && !isV ? '<p class="vtip">iPhone/iPad: Bild gedrückt halten › „Zu Fotos hinzufügen“.</p>' : ''}
      </div>`;
    $('vx').onclick = closeViewer;
    if ($('vp')) { $('vp').onclick = () => step(-1); $('vn').onclick = () => step(1); }
    // Wischen
    let sx = null; const vm = $('vm');
    vm.ontouchstart = e => { sx = e.touches[0].clientX; };
    vm.ontouchend = e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50 && !isV) step(dx < 0 ? 1 : -1); };
    const confirmBtn = (btn, q, fn) => { let armed = false; btn.onclick = async () => { if (!armed) { armed = true; btn.textContent = q; btn.classList.remove('ghost'); setTimeout(() => { if (btn.isConnected && armed) { armed = false; drawViewer(); } }, 4000); return; } btn.disabled = true; await fn(); }; };
    if ($('vrep')) confirmBtn($('vrep'), 'Wirklich entfernen?', async () => {
      try { await api.albumReport(code, x.id); data.items = data.items.filter(y => y.id !== x.id); toast('Entfernt. Das Team schaut es sich an.'); }
      catch (e) { toast('Hat nicht geklappt – bitte erneut versuchen.'); }
      afterRemove();
    });
    if ($('vdel')) confirmBtn($('vdel'), 'Wirklich löschen?', async () => {
      try { await api.albumRemoveOwn(client, x.id); data.items = data.items.filter(y => y.id !== x.id); toast('Gelöscht.'); }
      catch (e) { toast('Hat nicht geklappt – bitte erneut versuchen.'); }
      afterRemove();
    });
  }
  function afterRemove() { const n = visibleItems().length; if (!n) closeViewer(); else { vIdx = Math.min(vIdx, n - 1); drawViewer(); } render(); }

  let toastT;
  function toast(m) {
    let t = $('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6f1ee;color:#111;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center'; document.body.appendChild(t); }
    t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- Hochladen ---------- */
  function loadImg(file) {
    return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res({ im, u }); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('format')); }; im.src = u; });
  }
  function toJpeg(src, w0, h0, max, q) {
    const s = Math.min(1, max / Math.max(w0, h0)), w = Math.round(w0 * s), h = Math.round(h0 * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(src, 0, 0, w, h);
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('format')), 'image/jpeg', q));
  }
  async function preparePhoto(file) {
    const { im, u } = await loadImg(file);
    try {
      const full = await toJpeg(im, im.naturalWidth, im.naturalHeight, 2048, 0.85);
      const thumb = await toJpeg(im, im.naturalWidth, im.naturalHeight, 480, 0.72);
      return { kind: 'photo', mime: 'image/jpeg', blob: full, thumb, size: full.size, thumb_size: thumb.size };
    } finally { URL.revokeObjectURL(u); }
  }
  function videoMime(file) {
    if (file.type && /^video\/(mp4|quicktime|webm)$/.test(file.type)) return file.type;
    const n = (file.name || '').toLowerCase();
    return n.endsWith('.mov') ? 'video/quicktime' : n.endsWith('.webm') ? 'video/webm' : n.endsWith('.mp4') || n.endsWith('.m4v') ? 'video/mp4' : null;
  }
  async function prepareVideo(file) {
    const mime = videoMime(file); if (!mime) throw Object.assign(new Error('format'), { code: 'format' });
    if (file.size > 52428800) throw Object.assign(new Error('too_big'), { code: 'too_big' });
    const u = URL.createObjectURL(file), v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = u;
    const wait = (ev, ms) => new Promise(res => { const t = setTimeout(() => res(false), ms); v.addEventListener(ev, () => { clearTimeout(t); res(true); }, { once: true }); });
    let duration = null, thumb = null;
    try {
      if (await wait('loadedmetadata', 8000)) duration = isFinite(v.duration) ? Math.round(v.duration * 10) / 10 : null;
      if (duration != null && duration > 31) throw Object.assign(new Error('too_long'), { code: 'too_long' });
      // Länge nicht lesbar (seltenes Format): nur kleine Dateien zulassen
      if (duration == null && file.size > 26214400) throw Object.assign(new Error('too_big'), { code: 'too_big' });
      v.currentTime = Math.min(0.5, (duration || 1) / 2);
      if (await wait('seeked', 4000) && v.videoWidth) thumb = await toJpeg(v, v.videoWidth, v.videoHeight, 480, 0.72).catch(() => null);
    } finally { URL.revokeObjectURL(u); }
    return { kind: 'video', mime, blob: file, thumb, size: file.size, thumb_size: thumb ? thumb.size : 0, duration };
  }
  const MSG = {
    too_big: 'Clip zu groß (max. 50 MB) – bitte kürzen oder mit geringerer Qualität aufnehmen.',
    too_long: 'Clip länger als 30 Sekunden – bitte am Handy kürzen und erneut wählen.',
    full: 'Das Album ist voll. Bitte sag dem Team Bescheid.',
    upload_closed: 'Hochladen ist beendet.',
    format: 'Dieses Format kann nicht gelesen werden.',
    network: 'Keine Verbindung – „Erneut“ tippen.',
    album_closed: 'Das Album ist geschlossen.'
  };

  let active = 0; const waiting = [];
  function addFiles(files) {
    const q = $('queue'); if (!q) return;
    files.forEach(file => {
      const row = document.createElement('div'); row.className = 'qi';
      row.innerHTML = `<div class="ph">${file.type.startsWith('video') ? '🎬' : '📷'}</div><div><div class="st">Wartet …</div><div class="bar0"><i></i></div></div><span></span>`;
      q.prepend(row);
      waiting.push({ file, row });
    });
    pump();
  }
  function pump() { while (active < 2 && waiting.length) { const j = waiting.shift(); active++; uploading++; runJob(j).finally(() => { active--; uploading--; pump(); if (!active && !waiting.length) load(true); }); } }
  async function runJob(j) {
    const st = j.row.querySelector('.st'), bar = j.row.querySelector('.bar0 i'), side = j.row.lastElementChild;
    const setSt = (t, cls) => { st.textContent = t; st.className = 'st' + (cls ? ' ' + cls : ''); };
    try {
      setSt('Wird vorbereitet …');
      const isV = (j.file.type || '').startsWith('video') || !!videoMime(j.file) && !(j.file.type || '').startsWith('image');
      const f = j.prepared || (j.prepared = isV ? await prepareVideo(j.file) : await preparePhoto(j.file));
      if (f.thumb && !j.row.querySelector('img')) { const im = document.createElement('img'); im.src = URL.createObjectURL(f.thumb); j.row.firstElementChild.replaceWith(im); }
      setSt('Wird hochgeladen …');
      const name = $('nm') ? $('nm').value.trim() : '';
      const b = await api.albumBegin(code, client, name, f);
      const total = f.size + (f.thumb_size || 0);
      if (f.thumb && b.thumb_path) await api.albumUpload(b.thumb_path, f.thumb, p => { bar.style.width = (p * f.thumb_size / total * 100) + '%'; });
      await api.albumUpload(b.path, f.blob, p => { bar.style.width = (((f.thumb_size || 0) + p * f.size) / total * 100) + '%'; });
      const r = await api.albumDone(client, b.id);
      if (!r || !r.ok) throw Object.assign(new Error('server'), { code: 'server' });
      bar.style.width = '100%'; setSt('✓ Hochgeladen', 'ok');
    } catch (e) {
      const c = (e && e.code) || (e && e.message) || 'server';
      setSt(MSG[c] || 'Hat nicht geklappt.', 'bad');
      if (c === 'network' || c === 'server') {
        side.innerHTML = '<button class="btn ghost small" type="button">Erneut</button>';
        side.firstChild.onclick = () => { side.innerHTML = ''; bar.style.width = '0'; waiting.push(j); pump(); };
      }
    }
  }

  window.addEventListener('beforeunload', e => { if (uploading) { e.preventDefault(); e.returnValue = ''; } });

  (async () => {
    code = await findCode();
    if (code) load(); else showGate();
  })();
})();
</script>
</body>
